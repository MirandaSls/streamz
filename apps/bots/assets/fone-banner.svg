    <rect x="940" y="120" width="14" height="160" rx="7"/>
  </g>
  <!-- ondas sonoras -->
  <g fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="6" stroke-linecap="round">
    <path d="M40 200 Q 110 120 180 200 T 320 200 T 460 200 T 600 200"/>
  </g>
  <text x="70" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="150" font-weight="700" fill="#fff">Fone</text>
  <text x="76" y="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" fill="#fde4ff" fill-opacity="0.92">música para o seu servidor</text>
