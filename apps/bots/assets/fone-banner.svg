      <stop offset="0" stop-color="#2a0f4d"/>
      <stop offset="0.5" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- equalizador translúcido -->
  <g fill="#fff" fill-opacity="0.16">
    <rect x="560" y="170" width="24" height="60" rx="12"/>
    <rect x="600" y="120" width="24" height="160" rx="12"/>
    <rect x="640" y="70" width="24" height="260" rx="12"/>
    <rect x="680" y="140" width="24" height="120" rx="12"/>
    <rect x="720" y="40" width="24" height="320" rx="12"/>
    <rect x="760" y="110" width="24" height="180" rx="12"/>
    <rect x="800" y="150" width="24" height="100" rx="12"/>
    <rect x="840" y="60" width="24" height="280" rx="12"/>
    <rect x="880" y="100" width="24" height="200" rx="12"/>
    <rect x="920" y="30" width="24" height="340" rx="12"/>
    <rect x="960" y="130" width="24" height="140" rx="12"/>
    <rect x="1000" y="80" width="24" height="240" rx="12"/>
    <rect x="1040" y="160" width="24" height="80" rx="12"/>
