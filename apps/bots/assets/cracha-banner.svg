<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Crachá, cargos e permissões">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a2a05"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <g id="t">
      <rect width="90" height="120" rx="16"/>
      <rect x="31" y="12" width="28" height="10" rx="5" fill="#000" fill-opacity="0.25"/>
      <circle cx="45" cy="60" r="16" fill="#000" fill-opacity="0.2"/>
      <rect x="20" y="92" width="50" height="8" rx="4" fill="#000" fill-opacity="0.2"/>
    </g>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- fileiras de crachás translúcidos -->
  <g fill="#fff" fill-opacity="0.16">
    <use href="#t" x="580" y="30"/>
    <use href="#t" x="700" y="30"/>
    <use href="#t" x="820" y="30"/>
    <use href="#t" x="940" y="30"/>
    <use href="#t" x="1060" y="30"/>
    <use href="#t" x="640" y="170"/>
    <use href="#t" x="760" y="170"/>
    <use href="#t" x="880" y="170"/>
    <use href="#t" x="1000" y="170"/>
    <use href="#t" x="1120" y="170"/>
    <use href="#t" x="580" y="310"/>
    <use href="#t" x="700" y="310"/>
    <use href="#t" x="820" y="310"/>
    <use href="#t" x="940" y="310"/>
    <use href="#t" x="1060" y="310"/>
  </g>
  <text x="70" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="150" font-weight="700" fill="#fff">Crachá</text>
  <text x="76" y="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" fill="#fff3d6" fill-opacity="0.92">cargos e permissões</text>
</svg>
