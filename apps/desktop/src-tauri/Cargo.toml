[package]
name = "streamz-desktop"
version = "0.0.4"
description = "Streamz desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` habilita a API de bandeja (tauri::tray::TrayIconBuilder).
# `image-png` permite carregar/usar ícones PNG (usado pelo tray e por Image).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Plugins do Tauri 2 (a API v2 separou notificação/updater em crates próprias).
tauri-plugin-notification = "2"
# Auto-update: o `updater` baixa e instala; o `process` reinicia o app depois.
# Sem os dois, "atualizar" pararia no meio — instalado, mas rodando a versão
# velha até o usuário fechar por conta.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
