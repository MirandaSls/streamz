[package]
name = "streamz-desktop"
version = "0.0.8"
description = "Streamz desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` habilita a API de bandeja (tauri::tray::TrayIconBuilder).
# `image-png` permite carregar/usar ícones PNG (usado pelo tray e por Image).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Plugins do Tauri 2 (a API v2 separou notificação/updater em crates próprias).
tauri-plugin-notification = "2"
# Auto-update: o `updater` baixa e instala; o `process` reinicia o app depois.
# Sem os dois, "atualizar" pararia no meio — instalado, mas rodando a versão
# velha até o usuário fechar por conta.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Só no Windows: o compartilhamento de tela nativo é a API do Windows, e em
# outro alvo o módulo `tela` devolve lista vazia sem tocar em nada disto.
[target.'cfg(windows)'.dependencies]
# 0.61 é a versão que o próprio Tauri já traz (via webview2-com). Fixar a mesma
# evita compilar duas cópias do `windows` no mesmo binário.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# `default-features = false`: o `image` completo traz uma dúzia de decodificadores
# (webp, tiff, avif…) para uma tarefa que só escreve PNG de 32×32.
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
