[package]
name = "streamz-desktop"
version = "1.3.2"
description = "Streamz desktop app"
edition = "2021"

# O crate é **biblioteca e binário** ao mesmo tempo, e não só binário.
#
# Por quê: no Android/iOS não há `main()`. O sistema carrega uma biblioteca
# nativa (`.so` no Android, estática no iOS) e chama o ponto de entrada que o
# `tauri::mobile_entry_point` gera — ou seja, o app precisa existir como
# `cdylib`/`staticlib`. O `rlib` é o que o `main.rs` do desktop consome.
# É o formato que a própria doc do Tauri 2 manda usar para suportar mobile:
# <https://v2.tauri.app/start/migrate/from-tauri-1/>.
#
# O nome tem sufixo `_lib` porque um `[lib]` não pode ter o mesmo nome do
# `[package]` quando os dois convivem no mesmo crate.
#
# Para o desktop nada muda: o `main.rs` continua gerando o mesmo executável,
# com o mesmo código — só que agora o código mora em `lib.rs`.
[lib]
name = "streamz_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` habilita a API de bandeja (tauri::tray::TrayIconBuilder).
# `image-png` permite carregar/usar ícones PNG (usado pelo tray e por Image).
# `devtools`: o inspetor também nos builds de release. O Discord faz o mesmo
# (Ctrl+Shift+I abre lá), e sem ele todo defeito que só aparece no app
# instalado — o áudio do macOS de 2026-09-22 foi um — vira depoimento em
# vez de log. Em debug o Tauri já o liga sozinho; esta linha é o release.
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Plugins do Tauri 2 (a API v2 separou notificação/updater em crates próprias).
tauri-plugin-notification = "2"
# Ações da imagem em tela cheia (ver `components/modals/ImageModal.tsx`):
# `opener` abre no navegador do sistema — o WebView2 não tem abas e
# `window.open`/`target="_blank"` morrem em silêncio dentro do app, que era o
# defeito do botão "Abrir no navegador"; `clipboard-manager` é a segunda
# chance para "Copiar imagem" quando o `navigator.clipboard.write` do WebView2
# recusa; `dialog` + `fs` são o "Salvar como" de verdade (o diálogo do Windows
# escolhe o caminho, o `fs` escreve os bytes, sem passar pelo navegador).
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Auto-update: o `updater` baixa e instala; o `process` reinicia o app depois.
# Sem os dois, "atualizar" pararia no meio — instalado, mas rodando a versão
# velha até o usuário fechar por conta.
#
# **Fora do Android/iOS**, e por dois motivos que se somam: o atualizador do
# Tauri simplesmente não tem implementação mobile (na loja quem atualiza é a
# loja), e o `tauri-plugin-updater` arrasta `zip`/`tar`/`flate2` e o
# instalador de cada sistema — peso morto num `.apk`. Para o desktop nada
# muda: `cfg(not(any(android, ios)))` é verdade em Windows, macOS e Linux,
# então as duas crates entram exatamente como antes.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Só no Windows: o compartilhamento de tela nativo é a API do Windows, e em
# outro alvo o módulo `tela` devolve lista vazia sem tocar em nada disto.
[target.'cfg(windows)'.dependencies]
# `PermissionRequested` do WebView2 (ver `src/permissoes.rs`). A versão é a
# mesma que o Tauri usa — o `ICoreWebView2Controller` que o `with_webview`
# entrega vem deste crate, e duas cópias dele seriam dois tipos diferentes com
# o mesmo nome.
webview2-com = "0.38"
# 0.62 é a versão que o `windows-capture` exige. O Tauri (via webview2-com)
# ainda está em 0.61, então o binário compila duas cópias do `windows` — custo
# de tempo de build, não de tamanho relevante (só o que se usa entra). Fixar a
# nossa em 0.62 mantém pelo menos o nosso código e a captura na mesma.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # `CopyResource` na textura de staging reaproveitada do WGC (ver
    # `src/tela/captura/wgc.rs`). O `windows-capture` já liga esta feature
    # para si; declarar aqui é não depender dessa coincidência.
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # WASAPI loopback (áudio do sistema): `Media_Audio` é a API, `System_Com`
    # o `CoCreateInstance`, e `StructuredStorage` + `Variant` só porque o
    # `Activate` do `IMMDevice` recebe um `PROPVARIANT` opcional e o gerador
    # do crate condiciona o método às duas features.
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # `UserDuckingPreference` (ver `src/atenuacao.rs`).
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Captura de tela: Windows Graphics Capture (com `IsBorderRequired = false`,
# que é o que tira a borda amarela no Windows 11) e DXGI Desktop Duplication
# (o caminho sem borda no Windows 10). Ver `src/tela/captura/mod.rs`.
windows-capture = "2.0.1"
# Publica a captura na sala como o participante `<userId>#tela`, direto deste
# processo. Traz o libwebrtc pré-compilado (`webrtc-sys` baixa no build): o
# instalador cresce dezenas de MB, e é o preço de não passar os quadros pelo
# webview. `native-tls` porque o sinal é `wss://` e o SDK não liga TLS sozinho.
livekit = { version = "0.8", features = ["native-tls"] }
# Só pelo tipo do receptor de eventos da sala (`mpsc::UnboundedReceiver`); o
# runtime é o do Tauri.
tokio = { version = "1", features = ["sync"] }
# `default-features = false`: o `image` completo traz uma dúzia de decodificadores
# (webp, tiff, avif…) para duas tarefas que só escrevem: PNG de 32×32 (ícone)
# e JPEG de 480 px (miniatura da grade).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

# Só no Linux: o `permission-request` e os ajustes de mídia do WebKitGTK (ver
# `src/permissoes_linux.rs`). Pelo mesmo motivo do `webview2-com` acima, a
# versão é a que o wry e o `tauri-runtime-wry` já puxam (2.0.2 no `Cargo.lock`):
# o `webkit2gtk::WebView` que o `with_webview` entrega vem deste crate, e duas
# cópias seriam dois tipos com o mesmo nome. `v2_38` é o que expõe o
# `set_enable_webrtc` (e, por arrasto, o `DeviceInfoPermissionRequest` de
# `v2_24`); não pede WebKitGTK mais novo do que já se exige, porque o
# `tauri-runtime-wry` liga `v2_40` nesta mesma crate.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_38"] }
