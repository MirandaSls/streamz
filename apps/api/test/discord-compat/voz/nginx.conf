# O terminador TLS do ambiente de prova: é o Traefik de mentira.
#
# Existe porque o `@discordjs/voice` fixa `wss://` no código e o koe (Lavalink)
# faz o mesmo — não há como apontar um bot para `ws://`. Em produção este papel
# é do Traefik, e a ponte continua falando HTTP puro por dentro (§D5.5): o
# `proxy_pass` abaixo é exatamente o que o router do Traefik faz.

events {}

http {
  # O WebSocket do voice gateway fica **em silêncio entre faixas**. Um
  # `proxy_read_timeout` curto derrubaria a conexão no meio da música e o
  # sintoma seria "o som some depois de um minuto" — o mesmo motivo pelo qual
  # o DNS do `voz.streamz.chat` fica em nuvem cinza no Cloudflare (§D5.5).
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  server {
    listen 443 ssl;
    http2 on;
    server_name voz.teste;

    ssl_certificate     /certs/folha.pem;
    ssl_certificate_key /certs/folha.key;

    location / {
      proxy_pass http://ponte:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
