# App de desktop (Tauri) para Windows.
#
# Dois jobs com propósitos diferentes:
#
# - `checar` roda a cada PR que mexe em `apps/desktop/` e só **compila** o Rust
#   (clippy + fmt). Sem ele nada verificava o `src-tauri`: o ci.yml é Ubuntu sem
#   Rust, e este arquivo só rodava à mão — um erro de compilação ficaria
#   escondido até alguém disparar o build do instalador, semanas depois.
# - `instalador` continua **só à mão**: o .exe não muda a cada commit, e gerar o
#   bundle leva dezenas de minutos. Quando sair uma versão que vale distribuir,
#   dispare este workflow e baixe o artefato.
#
# Por que os dois no Windows: o `src-tauri` do Streamz captura tela pela API do
# Windows, então metade do código é `#[cfg(windows)]` e não existe em outro
# alvo. Compilar no Ubuntu não provaria nada. Runner Windows custa o dobro de
# minutos em repositório privado, e é por isso que o `checar` tem filtro de
# caminho e não builda a web — ele nunca roda num PR que não toca no desktop.
name: Desktop (Windows)

on:
  # O filtro de caminho é o que mantém o custo honesto: PR de web ou api não
  # acorda runner Windows.
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Gerar artefatos de atualização (assinados). Exige o segredo
          TAURI_SIGNING_PRIVATE_KEY e a chave pública em tauri.conf.json.
        type: boolean
        default: false

# O evento entra na chave, e não só o ref, porque os dois jobs deste arquivo
# têm valor de tempo oposto: a checagem de PR é curta e some a cada push, e o
# instalador é um build de meia hora que alguém pediu de propósito. Agrupados
# juntos, um push no main tocando `apps/desktop/` cancelaria um instalador em
# andamento — e quem pediu o .exe só descobriria meia hora depois.
#
# Daí também o cancelamento condicional: agressivo onde a execução é barata e
# repetida (PR), nunca onde ela é longa e deliberada (instalador).
concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checar:
    name: clippy + fmt (src-tauri)
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # O `build.rs` do Tauri valida a config, e a config aponta `frontendDist`
      # para `apps/web/out`. Buildar a web inteira aqui custaria mais que a
      # checagem que viemos fazer — e não acrescenta nada, porque o ci.yml já
      # prova o export estático no Ubuntu. Um `out/` de mentira satisfaz a
      # validação e o clippy segue para o que interessa: o Rust.
      - name: Placeholder do frontendDist
        working-directory: .
        shell: bash
        run: |
          mkdir -p apps/web/out
          echo '<!doctype html><title>placeholder</title>' > apps/web/out/index.html

      - name: Formatação
        run: cargo fmt --check

      # `--all-targets` pega testes e exemplos também; `-D warnings` é o que
      # transforma a checagem em portão — clippy que só avisa ninguém lê.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  instalador:
    name: instalador .exe
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      # o alvo do bundle é o do runner; sem cache, cada build recompila o
      # mundo do Rust e leva mais de meia hora
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # o Tauri empacota o `out/` estático da web, e o `beforeBuildCommand` do
      # tauri.conf o gera — mas o contrato compilado precisa existir antes
      - name: Build do contrato compartilhado
        run: pnpm --filter @streamz/shared build

      # Falhar aqui, e não no meio do build de meia hora: sem a chave privada o
      # Tauri produziria um instalador sem `.sig`, que o atualizador recusa —
      # e a falha só apareceria no cliente, semanas depois.
      - name: Conferir a chave de assinatura
        if: inputs.release
        shell: bash
        env:
          CHAVE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$CHAVE" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY não está configurado. Ver apps/desktop/README.md."
            exit 1
          fi
          if ! grep -q '"pubkey": *"[^"]' apps/desktop/src-tauri/tauri.conf.json; then
            echo "::error::A chave pública não foi preenchida em tauri.conf.json. Ver apps/desktop/README.md."
            exit 1
          fi

      # `NEXT_PUBLIC_*` é embutida no bundle: sem estas, o app instalado
      # apontaria para localhost e não falaria com a produção
      - name: Build do instalador
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_LIVEKIT_URL: ${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}
          NEXT_TELEMETRY_DISABLED: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          pnpm --filter @streamz/desktop build
          ${{ inputs.release && '--config src-tauri/tauri.release.conf.json' || '' }}

      # A assinatura é o que vai para DESKTOP_UPDATE_SIGNATURE na API. Ela é
      # pública (verifica, não autoriza), então imprimi-la no log é seguro — e
      # é muito mais prático que baixar o artefato só para ler um arquivo.
      - name: Assinatura para a API
        if: inputs.release
        shell: bash
        run: |
          for sig in apps/desktop/src-tauri/target/release/bundle/nsis/*.sig; do
            echo "== $(basename "$sig")"
            cat "$sig"
            echo
          done

      - name: Listar o que saiu
        shell: bash
        run: ls -la apps/desktop/src-tauri/target/release/bundle/nsis apps/desktop/src-tauri/target/release/bundle/msi || true

      - uses: actions/upload-artifact@v4
        with:
          name: streamz-windows
          retention-days: 30
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
