# Instalador do app de desktop (Tauri) para Windows.
#
# Roda **só à mão**: o .exe não muda a cada commit, e runner Windows em
# repositório privado custa o dobro de minutos. Quando sair uma versão que vale
# distribuir, dispare este workflow e baixe o artefato.
#
# Por que não sai do servidor: o bundle NSIS/MSI é gerado pelo toolchain do
# Windows. Compilar Tauri para Windows a partir do Linux não é caminho
# suportado — este runner é o caminho.
name: Desktop (Windows)

on:
  workflow_dispatch:

concurrency:
  group: desktop-windows
  cancel-in-progress: true

jobs:
  instalador:
    name: instalador .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      # o alvo do bundle é o do runner; sem cache, cada build recompila o
      # mundo do Rust e leva mais de meia hora
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # o Tauri empacota o `out/` estático da web, e o `beforeBuildCommand` do
      # tauri.conf o gera — mas o contrato compilado precisa existir antes
      - name: Build do contrato compartilhado
        run: pnpm --filter @streamz/shared build

      # `NEXT_PUBLIC_*` é embutida no bundle: sem estas, o app instalado
      # apontaria para localhost e não falaria com a produção
      - name: Build do instalador
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_LIVEKIT_URL: ${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @streamz/desktop build

      - name: Listar o que saiu
        shell: bash
        run: ls -la apps/desktop/src-tauri/target/release/bundle/nsis apps/desktop/src-tauri/target/release/bundle/msi || true

      - uses: actions/upload-artifact@v4
        with:
          name: streamz-windows
          retention-days: 30
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
