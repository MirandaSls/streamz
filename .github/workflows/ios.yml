# PLANO B — build do iOS no GitHub Actions. NÃO é o caminho principal.
#
# O caminho principal é o `codemagic.yaml` da raiz. Este arquivo existe porque
# o Actions pode voltar a ser útil se a cobrança do GitHub for destravada e a
# cota gratuita do Codemagic acabar no meio do mês.
#
# POR QUE ELE NÃO É O PADRÃO:
#
# 1. Desde 2026-09-03 o Actions do repositório **não inicia job nenhum**: a
#    conta caiu em pendência de cobrança e os jobs aparecem como *failure* com
#    zero passos. Naquele dia os workflows `ci.yml`, `deploy.yml` e
#    `desktop.yml` foram removidos do repositório a pedido do usuário
#    (§3.5 do `docs/PROCESSO-DE-DESENVOLVIMENTO.md`), e desde então
#    `.github/workflows/` está vazio. Este arquivo é o primeiro a voltar.
# 2. O repositório é **privado** e `macos-14` custa **10× minuto** de Linux.
#    Um build de ~25 min vira ~250 min de cota. A cota gratuita de repositório
#    privado é 2000 min/mês de Linux, ou seja, ~8 builds de iOS por mês e mais
#    nada rodando.
# 3. A assinatura aqui é na mão: certificado e perfil viram segredos do repo,
#    em base64. No Codemagic isso é automático.
#
# Por isso o único gatilho é `workflow_dispatch`: nada roda sozinho, nem em
# push, nem em PR, nem em tag.
#
# NENHUM SEGREDO NESTE ARQUIVO. Os valores ficam em Settings > Secrets and
# variables > Actions. Ver a tabela em `docs/APPS-MOBILE.md`.
#
# O que este arquivo NÃO prova: que compila. Ele nunca rodou.

name: iOS (manual)

on:
  workflow_dispatch:
    inputs:
      subir_para_testflight:
        description: "Subir o .ipa para o TestFlight ao final"
        type: boolean
        default: false

# Sem permissão de escrita: este workflow só lê o código e produz um artefato.
permissions:
  contents: read

jobs:
  ipa:
    name: Gerar o .ipa
    # macOS 14 (Sonoma) — é o que tem Xcode 15+, o mínimo prático para
    # submeter à App Store hoje.
    runs-on: macos-14
    timeout-minutes: 60

    env:
      # As mesmas três de `scripts/build-desktop-no-servidor.sh` e do
      # `codemagic.yaml`: é o que o `next build` embute no bundle estático.
      NEXT_PUBLIC_API_URL: https://api.streamz.chat
      NEXT_PUBLIC_WS_URL: https://api.streamz.chat
      NEXT_PUBLIC_LIVEKIT_URL: wss://livekit.streamz.chat
      NEXT_TELEMETRY_DISABLED: "1"
      DIR_APPLE: apps/desktop/src-tauri/gen/apple
      BUNDLE_ID: chat.streamz.app

    steps:
      - uses: actions/checkout@v4

      - name: Node 22 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ativar o pnpm do packageManager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate

      - name: Rust com o alvo do iPhone
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios
          rustc --version

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ios-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Dependências do monorepo
        run: pnpm install --frozen-lockfile

      - name: Build do @streamz/shared
        # O `next build` resolve `@streamz/shared` pelo `dist`; sem isto o
        # build da web quebra (mesmo motivo do §3.2 do processo).
        run: pnpm --filter @streamz/shared build

      - name: Gerar o projeto Xcode
        run: pnpm --filter @streamz/desktop exec tauri ios init
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}

      - name: Conferir o bundle identifier gerado
        # O identifier do desktop é `dev.streamz.app`; o do iOS vem do
        # `tauri.ios.conf.json`. Trava para o caso de o `tauri ios init`
        # ignorar o config (tauri-apps/tauri#9851).
        run: |
          set -euo pipefail
          if ! grep -rq "$BUNDLE_ID" "$DIR_APPLE"/*.xcodeproj/project.pbxproj; then
            echo "ERRO: o projeto Xcode gerado não usa $BUNDLE_ID." >&2
            grep -rho 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*' \
              "$DIR_APPLE"/*.xcodeproj/project.pbxproj | sort -u >&2
            exit 1
          fi
          echo "ok: $BUNDLE_ID presente no projeto gerado"

      - name: Gravar a chave da App Store Connect
        # A `.p8` é um segredo do repositório guardado em base64 (o arquivo
        # tem quebras de linha). Ela vive só no runner, some com ele, e o
        # `RUNNER_TEMP` não vai para artefato nenhum.
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode \
            > "$RUNNER_TEMP/AuthKey.p8"
          test -s "$RUNNER_TEMP/AuthKey.p8"

      - name: Build do .ipa
        # `APPLE_API_ISSUER`, `APPLE_API_KEY` e `APPLE_API_KEY_PATH` são as
        # variáveis que o próprio Tauri lê para assinar em CI (assinatura
        # automática, sem certificado exportado à mão).
        # https://v2.tauri.app/distribute/sign/ios/
        #
        # O `beforeBuildCommand` do tauri.conf.json já roda o build da web e o
        # next.config liga o `output: "export"` ao ver as TAURI_ENV_*. Por isso
        # não há um passo separado de build da web.
        run: |
          set -euo pipefail
          pnpm --filter @streamz/desktop exec tauri ios build \
            --export-method app-store-connect
          ls -la "$DIR_APPLE"/build/arm64/
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8

      - name: Guardar o .ipa
        uses: actions/upload-artifact@v4
        with:
          name: streamz-ios
          path: apps/desktop/src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Subir para o TestFlight
        if: inputs.subir_para_testflight
        # Caminho manual da doc do Tauri, para quando não se usa o publishing
        # automático do Codemagic.
        run: |
          set -euo pipefail
          xcrun altool --upload-app --type ios \
            --file "$(ls "$DIR_APPLE"/build/arm64/*.ipa | head -1)" \
            --apiKey "${{ secrets.APPLE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPLE_API_ISSUER }}"
        env:
          # O altool procura a chave em ~/private_keys/AuthKey_<KeyID>.p8.
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}

      - name: Apagar a chave
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
