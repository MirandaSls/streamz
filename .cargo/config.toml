# Flags de link do app de desktop (apps/desktop/src-tauri).
#
# A `libwebrtc` que o crate `livekit` baixa para Windows vem compilada com a
# CRT **estática** (/MT). Sem esta flag o resto do binário sai com a CRT
# dinâmica (/MD) e o `link.exe` recusa a mistura: centenas de
# `LNK2038: mismatch detected for 'RuntimeLibrary'` e `LNK2005: already
# defined` — foi o que derrubou o build da 0.0.11. É a mesma configuração que
# o próprio livekit/rust-sdks usa no `.cargo/config.toml` dele.
#
# Fica na raiz do repositório (e não em src-tauri) porque o cargo procura o
# arquivo subindo a partir do diretório atual: vale rodando `cargo` de qualquer
# pasta do monorepo, inclusive pelo `tauri build`.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# A mesma `libwebrtc` do `livekit`, agora também no macOS — e lá ela é estática
# e traz **categorias** de Objective-C (`NSString (StdString)`,
# `RTCH264ProfileLevelId`…). O linker descarta categoria que ninguém referencia
# por símbolo, e sem `-ObjC` o app **compila** e morre ao abrir:
# `'NSInvalidArgumentException' … -[RTCVideoCodecInfo nativeSdpVideoFormat]:
# unrecognized selector`. Erro de execução, não de compilação — o tipo que só
# aparece depois do build inteiro, no Mac, e não diz o que fazer.
#
# É a mesma configuração do `.cargo/config.toml` do livekit/rust-sdks. Só
# macOS: o iOS não compila o livekit.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-args=-ObjC"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-args=-ObjC"]
