services:
  postgres:
    image: postgres:16-alpine
    container_name: streamz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamz}
      POSTGRES_DB: ${POSTGRES_DB:-streamz}
    # Só na loopback: o banco de dev não fica exposto na rede local.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-streamz}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LiveKit self-hosted (alternativa ao LiveKit Cloud). Fica sob o profile
  # "livekit" para NÃO subir junto do Postgres no `pnpm db:up`; use
  # `pnpm livekit:up`. Config e chaves em ./livekit.yaml (batem com o .env).
  livekit:
    image: livekit/livekit-server:latest
    container_name: streamz-livekit
    profiles: ["livekit"]
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880" # signaling (ws)
      - "7881:7881" # rtc/tcp fallback
      - "7882:7882/udp" # rtc/udp — porta única de mídia (mux), ver livekit.yaml

  # ── j-bots ── a ponte de voz dos bots do Discord (F2, §D5.5) ───────────────
  # Traduz o voice gateway do Discord (WS + RTP/UDP cifrado) para o LiveKit, de
  # modo que um bot de música (Lavalink, @discordjs/voice) entre no canal e o
  # som saia no navegador de quem está na call.
  #
  # Fica sob o profile "bots" para não subir junto do resto: sem `voz.streamz
  # .chat` no DNS e sem 7883/udp aberto no firewall (do sistema **e** do
  # provedor) ela não serve para nada, e essas duas coisas são ação do dono.
  #   docker compose --profile bots up -d ponte-voz
  ponte-voz:
    build:
      context: .
      dockerfile: apps/ponte-voz/Dockerfile
    container_name: streamz-ponte-voz
    profiles: ["bots"]
    restart: unless-stopped
    environment:
      PONTE_VOZ_PORTA_WS: "8080"
      PONTE_VOZ_PORTA_UDP: "7883"
      # O IP **público** do servidor, não um hostname: é o que vai no
      # `READY.ip` do voice gateway, e o NAT do bot precisa de um número.
      # Cloudflare não entra na história — é UDP (§D5.4).
      PONTE_VOZ_IP_PUBLICO: ${PONTE_VOZ_IP_PUBLICO:-}
      # O mesmo segredo que a API usa para assinar o JWT do
      # VOICE_SERVER_UPDATE. Sem ele, a ponte recusa todo IDENTIFY com 4004 e
      # a API responde 503 no op 4 — de propósito.
      PONTE_VOZ_SEGREDO: ${PONTE_VOZ_SEGREDO:-}
      # Sem `LIVEKIT_URL` de propósito: a ponte **não** tem as credenciais do
      # LiveKit. A URL e o token da sala chegam **dentro** do JWT do
      # VOICE_SERVER_UPDATE, assinados pela API (§D5.6). Conferido no
      # `main.go`, que é o único lugar do binário que lê o ambiente.
      # Dentro da rede do compose a API é o serviço `api`, não localhost.
      API_INTERNA_URL: http://api:3333
    ports:
      # A mídia do bot vai **direta**, sem Traefik: ele não faz UDP (§D5.5).
      # Esta linha é repetida no override do Traefik, sob `ports: !override`.
      - "7883:7883/udp"
    depends_on:
      - api

  # ── Aplicação ──────────────────────────────────────────────────────────────
  # `pnpm db:up` continua subindo só o Postgres (ele nomeia o serviço). Estes
  # dois só sobem quando pedidos: `docker compose up -d api web`.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: streamz-api
    restart: unless-stopped
    # O .env da raiz vale como base; o que muda dentro da rede do compose é
    # sobrescrito abaixo (`environment` vence `env_file`).
    env_file:
      - .env
    environment:
      # Dentro da rede do compose o banco é o serviço `postgres`, não localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-streamz}:${POSTGRES_PASSWORD:-streamz}@postgres:5432/${POSTGRES_DB:-streamz}?schema=public
      # Uma instância só: aqui a migration no boot é segura e conveniente.
      RUN_MIGRATIONS: "1"
      API_HOST: 0.0.0.0
      API_PORT: "3333"
      LOG_FORMAT: json
      NODE_ENV: production
      # Vazio = Redis desligado (o código trata `REDIS_URL` ausente). Com o
      # profile `redis` no ar, aponte para redis://redis:6379.
      REDIS_URL: ${REDIS_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Dentro do contêiner a pasta é sempre esta; no host ela é ./downloads.
      DOWNLOAD_DIR: /app/downloads
      # Instaladores servidos ao ATUALIZADOR — pasta separada de propósito: a de
      # downloads é protegida por senha, e o atualizador não sabe autenticar.
      UPDATE_DIR: /app/updates
      DESKTOP_UPDATE_VERSION: ${DESKTOP_UPDATE_VERSION:-}
      DESKTOP_UPDATE_URL: ${DESKTOP_UPDATE_URL:-}
      DESKTOP_UPDATE_SIGNATURE: ${DESKTOP_UPDATE_SIGNATURE:-}
      DESKTOP_UPDATE_NOTES: ${DESKTOP_UPDATE_NOTES:-}
    volumes:
      # Instaladores do app de desktop servidos por /api/downloads. `:ro` porque
      # a API só lê — publicar versão é copiar o arquivo nesta pasta no host.
      - ./downloads:/app/downloads:ro
      - ./updates:/app/updates:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3333:3333"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* é embutida no bundle em tempo de build — mudar depois no
      # `environment` não teria efeito nenhum; por isso vai como build arg.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3333}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
    container_name: streamz-web
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

  # Redis é opcional (ver modules/realtime/redis.ts): só com ele a API roda em
  # mais de uma instância. Sob profile para não pesar no dev padrão:
  # `docker compose --profile redis up -d redis` e REDIS_URL=redis://redis:6379.
  redis:
    image: redis:7-alpine
    container_name: streamz-redis
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
