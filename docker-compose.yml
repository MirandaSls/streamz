services:
  postgres:
    image: postgres:16-alpine
    container_name: streamz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamz}
      POSTGRES_DB: ${POSTGRES_DB:-streamz}
    # Só na loopback: o banco de dev não fica exposto na rede local.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-streamz}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LiveKit self-hosted (alternativa ao LiveKit Cloud). Fica sob o profile
  # "livekit" para NÃO subir junto do Postgres no `pnpm db:up`; use
  # `pnpm livekit:up`. Config e chaves em ./livekit.yaml (batem com o .env).
  livekit:
    image: livekit/livekit-server:latest
    container_name: streamz-livekit
    profiles: ["livekit"]
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880" # signaling (ws)
      - "7881:7881" # rtc/tcp fallback
      - "7882:7882/udp" # rtc/udp — porta única de mídia (mux), ver livekit.yaml

  # ── j-bots ── a ponte de voz dos bots do Discord (F2, §D5.5) ───────────────
  # Traduz o voice gateway do Discord (WS + RTP/UDP cifrado) para o LiveKit, de
  # modo que um bot de música (Lavalink, @discordjs/voice) entre no canal e o
  # som saia no navegador de quem está na call.
  #
  # Fica sob o profile "bots" para não subir junto do resto: sem `voz.streamz
  # .chat` no DNS e sem 7883/udp aberto no firewall (do sistema **e** do
  # provedor) ela não serve para nada, e essas duas coisas são ação do dono.
  #   docker compose --profile bots up -d ponte-voz
  ponte-voz:
    build:
      context: .
      dockerfile: apps/ponte-voz/Dockerfile
    container_name: streamz-ponte-voz
    profiles: ["bots"]
    restart: unless-stopped
    environment:
      PONTE_VOZ_PORTA_WS: "8080"
      PONTE_VOZ_PORTA_UDP: "7883"
      # O IP **público** do servidor, não um hostname: é o que vai no
      # `READY.ip` do voice gateway, e o NAT do bot precisa de um número.
      # Cloudflare não entra na história — é UDP (§D5.4).
      PONTE_VOZ_IP_PUBLICO: ${PONTE_VOZ_IP_PUBLICO:-}
      # O mesmo segredo que a API usa para assinar o JWT do
      # VOICE_SERVER_UPDATE. Sem ele, a ponte recusa todo IDENTIFY com 4004 e
      # a API responde 503 no op 4 — de propósito.
      PONTE_VOZ_SEGREDO: ${PONTE_VOZ_SEGREDO:-}
      # Sem `LIVEKIT_URL` de propósito: a ponte **não** tem as credenciais do
      # LiveKit. A URL e o token da sala chegam **dentro** do JWT do
      # VOICE_SERVER_UPDATE, assinados pela API (§D5.6). Conferido no
      # `main.go`, que é o único lugar do binário que lê o ambiente.
      # Dentro da rede do compose a API é o serviço `api`, não localhost.
      API_INTERNA_URL: http://api:3333
    ports:
      # A mídia do bot vai **direta**, sem Traefik: ele não faz UDP (§D5.5).
      # Esta linha é repetida no override do Traefik, sob `ports: !override`.
      - "7883:7883/udp"
    depends_on:
      - api

  # ── j-bots ── Lavalink: o servidor de áudio dos bots oficiais (§D5.8) ──────
  # Sob o mesmo profile "bots" da ponte: sem a ponte no ar o Lavalink não tem
  # para onde mandar som, e subir um sem o outro só gasta memória.
  #   docker compose --profile bots up -d lavalink bot-musica
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: streamz-lavalink
    profiles: ["bots"]
    restart: unless-stopped
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_SENHA:-streamz}
      # A JVM, sem teto, reserva um quarto da RAM da máquina só para o heap.
      # Este servidor tem 6 núcleos e já caiu por OOM: o teto não é enfeite.
      _JAVA_OPTIONS: -Xmx512m -XX:+UseSerialGC
    volumes:
      - ./apps/bots/lavalink/application.yml:/opt/Lavalink/application.yml:ro
      # Os plugins são baixados do Maven na primeira subida; o volume evita
      # repetir o download a cada `up`.
      - lavalink-plugins:/opt/Lavalink/plugins
    # Sem `ports:` de propósito: o Lavalink só é falado de dentro da rede do
    # compose (pelo bot). Publicá-lo seria expor um servidor de áudio com senha
    # de arquivo à internet.
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header=\"Authorization: $${LAVALINK_SERVER_PASSWORD}\" http://127.0.0.1:2333/version >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10

  # ── j-bots ── Streamz Música ───────────────────────────────────────────────
  # **Um container por bot**, todos com a mesma imagem; `BOTS` diz qual roda.
  #
  # Por que um por bot e não um processo com todos: um bot que estoura derruba
  # só a si mesmo, o `restart` é por bot, o log já vem separado sem precisar
  # filtrar, e o token de cada um fica no ambiente **do seu** container — um
  # processo com cinco bots teria os cinco tokens na mesma tabela de ambiente.
  # O custo é o runtime do Node repetido (~40 MB por container), que é barato
  # perto de uma queda em cascata. O runtime aceita `BOTS=a,b` para quem quiser
  # o contrário em desenvolvimento.
  bot-musica:
    build:
      context: .
      dockerfile: apps/bots/Dockerfile
    container_name: streamz-bot-musica
    profiles: ["bots"]
    restart: unless-stopped
    environment:
      BOTS: musica
      # Dentro da rede do compose a API é o serviço `api`. **Sem** o /v10: o
      # @discordjs/rest o acrescenta (§14 do documento).
      STREAMZ_API_URL: http://api:3333/api
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      LAVALINK_SENHA: ${LAVALINK_SENHA:-streamz}
      LOG_FORMATO: json
      BOTS_DIR: /app/.bots
    volumes:
      # O token do bot, gravado pelo `provisionar` com chmod 600. Somente
      # leitura: o container nunca escreve credencial.
      - ./.bots:/app/.bots:ro
    depends_on:
      - api
      - lavalink
    mem_limit: 256m

  # ── j-bots ── Streamz Boas-vindas ──────────────────────────────────────────
  # Recebe quem chega no servidor. Não precisa de Lavalink nem da ponte de voz:
  # só do gateway da API. Depende só de `api`.
  #   docker compose --profile bots up -d bot-boas-vindas
  bot-boas-vindas:
    build:
      context: .
      dockerfile: apps/bots/Dockerfile
    container_name: streamz-bot-boas-vindas
    profiles: ["bots"]
    restart: unless-stopped
    environment:
      BOTS: boas-vindas
      # Dentro da rede do compose a API é o serviço `api`. **Sem** o /v10: o
      # @discordjs/rest o acrescenta (§14 do documento).
      STREAMZ_API_URL: http://api:3333/api
      LOG_FORMATO: json
      BOTS_DIR: /app/.bots
      # O estado do bot: um JSON por servidor. Ver apps/bots/src/boas-vindas/armazem.ts.
      BOAS_VINDAS_DIR: /dados
    volumes:
      # O token do bot, gravado pelo `provisionar` com chmod 600. Somente
      # leitura: o container nunca escreve credencial.
      - ./.bots:/app/.bots:ro
      # Volume **nomeado** e não um bind: a configuração de cada servidor é dado
      # do bot, não do repositório, e um bind em `./` acabaria versionado por
      # engano no primeiro `git add -A` distraído.
      - boas-vindas-dados:/dados
    depends_on:
      - api
    mem_limit: 192m

  # ── j-bots ── Streamz Moderação ────────────────────────────────────────────
  # O último do bloco de bots — é onde o `CONTRATO.md` manda pôr um bot novo,
  # para dois PRs de bots diferentes não disputarem as mesmas linhas.
  #
  # Sem Lavalink e sem `depends_on` além da API: este bot não toca em voz.
  bot-moderacao:
    build:
      context: .
      dockerfile: apps/bots/Dockerfile
    container_name: streamz-bot-moderacao
    profiles: ["bots"]
    restart: unless-stopped
    environment:
      BOTS: moderacao
      STREAMZ_API_URL: http://api:3333/api
      LOG_FORMATO: json
      BOTS_DIR: /app/.bots
      # Onde ficam os avisos e a configuração de cada servidor (um JSON por
      # servidor). Ver `apps/bots/src/moderacao/estado.ts` para o porquê de ser
      # arquivo e não tabela, e para o caminho de migração.
      MODERACAO_DIR: /dados
    volumes:
      - ./.bots:/app/.bots:ro
      # **Volume nomeado, não bind**: este é o único estado durável do bot, e um
      # `docker compose down -v` distraído levaria a ficha de moderação de todos
      # os servidores junto. Num volume ele sobrevive a `down`, a `up --build` e
      # à troca de imagem.
      - bot-moderacao-dados:/dados
    depends_on:
      - api
    mem_limit: 256m

  # ── j-bots ── Streamz Níveis ───────────────────────────────────────────────
  # XP por mensagem, ranking e cargos por nível. Entrou no fim do bloco de bots,
  # que é onde o `CONTRATO.md` manda pôr um bot novo (o `bot-cargos` entrou
  # depois e é quem está no fim agora).
  #
  # Sem Lavalink e sem `depends_on` além da API: níveis não tocam em voz.
  #
  # **O estado não vai para o Postgres**, e isso é decisão, não atalho: o bot
  # fala com a instância por HTTP como qualquer bot de terceiro, e uma tabela
  # nova seria uma migration — o arquivo mais compartilhado do repositório, que
  # o `apps/bots/CONTRATO.md` existe para nenhum bot precisar tocar. O estado é
  # um JSON por servidor num volume só dele, gravado em bloco (a cada 30 s ou
  # 50 mudanças, mais um flush no SIGTERM). O porquê inteiro, e a migração para
  # o banco quando ela fizer sentido, estão no cabeçalho de
  # `apps/bots/src/niveis/estado.ts`.
  bot-niveis:
    build:
      context: .
      dockerfile: apps/bots/Dockerfile
    container_name: streamz-bot-niveis
    profiles: ["bots"]
    restart: unless-stopped
    environment:
      BOTS: niveis
      # Dentro da rede do compose a API é o serviço `api`. **Sem** o /v10: o
      # @discordjs/rest o acrescenta (§14 do documento).
      STREAMZ_API_URL: http://api:3333/api
      # Onde os `<guildId>.json` moram. Ver o comentário do volume abaixo para
      # o porquê de não ser `/dados` (que é o padrão do código).
      NIVEIS_DIR: /home/node/dados
      LOG_FORMATO: json
      BOTS_DIR: /app/.bots
    volumes:
      # O token do bot, gravado pelo `provisionar` com chmod 600. Somente
      # leitura: o container nunca escreve credencial.
      - ./.bots:/app/.bots:ro
      # **Por que em `/home/node` e não em `/dados`.** A imagem roda como
      # `USER node`, e o Docker cria um volume nomeado com o dono do caminho
      # correspondente **na imagem** — que para um caminho que a imagem não tem
      # é `root:root`, e aí o processo não escreve nada (conferido:
      # `docker run -v vol:/dados -u node node:22-alpine touch /dados/x` dá
      # `Permission denied`). `/home/node` existe na imagem e é do `node`, então
      # o volume nasce do `node` e o bot cria o `dados/` dentro. A alternativa
      # seria um `mkdir`+`chown` no `apps/bots/Dockerfile` — que é comum a todos
      # os bots e o CONTRATO não deixa mexer.
      - niveis-dados:/home/node
    depends_on:
      - api
    mem_limit: 256m

  # ── j-bots ── Streamz Cargos ───────────────────────────────────────────────
  # O último do bloco de bots — é onde o `CONTRATO.md` manda pôr um bot novo,
  # para dois PRs de bots diferentes não disputarem as mesmas linhas.
  #
  # Cargos por reação. Não usa Lavalink nem a ponte de voz: só o gateway (com o
  # intent das reações, que é o que a F5 destravou) e o REST.
  bot-cargos:
    build:
      context: .
      dockerfile: apps/bots/Dockerfile
    container_name: streamz-bot-cargos
    profiles: ["bots"]
    restart: unless-stopped
    environment:
      BOTS: cargos
      # Dentro da rede do compose a API é o serviço `api`. **Sem** o /v10: o
      # @discordjs/rest o acrescenta (§14 do documento).
      STREAMZ_API_URL: http://api:3333/api
      LOG_FORMATO: json
      BOTS_DIR: /app/.bots
      # Os painéis: um JSON por servidor, com escrita atômica. Ver
      # `apps/bots/src/cargos/estado.ts` para o porquê de ser arquivo e não
      # tabela no banco do Streamz.
      CARGOS_DIR: /dados
    volumes:
      # O token do bot, gravado pelo `provisionar` com chmod 600. Somente
      # leitura: o container nunca escreve credencial.
      - ./.bots:/app/.bots:ro
      # **Volume nomeado, não bind**: os painéis são o único estado durável do
      # bot, e um bind em `./` acabaria versionado no primeiro `git add -A`
      # distraído.
      - cargos-dados:/dados
    depends_on:
      - api
    mem_limit: 256m

  # ── Aplicação ──────────────────────────────────────────────────────────────
  # `pnpm db:up` continua subindo só o Postgres (ele nomeia o serviço). Estes
  # dois só sobem quando pedidos: `docker compose up -d api web`.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: streamz-api
    restart: unless-stopped
    # O .env da raiz vale como base; o que muda dentro da rede do compose é
    # sobrescrito abaixo (`environment` vence `env_file`).
    env_file:
      - .env
    environment:
      # Dentro da rede do compose o banco é o serviço `postgres`, não localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-streamz}:${POSTGRES_PASSWORD:-streamz}@postgres:5432/${POSTGRES_DB:-streamz}?schema=public
      # Uma instância só: aqui a migration no boot é segura e conveniente.
      RUN_MIGRATIONS: "1"
      API_HOST: 0.0.0.0
      API_PORT: "3333"
      LOG_FORMAT: json
      NODE_ENV: production
      # Vazio = Redis desligado (o código trata `REDIS_URL` ausente). Com o
      # profile `redis` no ar, aponte para redis://redis:6379.
      REDIS_URL: ${REDIS_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Dentro do contêiner a pasta é sempre esta; no host ela é ./downloads.
      DOWNLOAD_DIR: /app/downloads
      # Instaladores servidos ao ATUALIZADOR — pasta separada de propósito: a de
      # downloads é protegida por senha, e o atualizador não sabe autenticar.
      UPDATE_DIR: /app/updates
      DESKTOP_UPDATE_VERSION: ${DESKTOP_UPDATE_VERSION:-}
      DESKTOP_UPDATE_URL: ${DESKTOP_UPDATE_URL:-}
      DESKTOP_UPDATE_SIGNATURE: ${DESKTOP_UPDATE_SIGNATURE:-}
      DESKTOP_UPDATE_NOTES: ${DESKTOP_UPDATE_NOTES:-}
    volumes:
      # Instaladores do app de desktop servidos por /api/downloads. `:ro` porque
      # a API só lê — publicar versão é copiar o arquivo nesta pasta no host.
      - ./downloads:/app/downloads:ro
      - ./updates:/app/updates:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3333:3333"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* é embutida no bundle em tempo de build — mudar depois no
      # `environment` não teria efeito nenhum; por isso vai como build arg.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3333}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
    container_name: streamz-web
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

  # Redis é opcional (ver modules/realtime/redis.ts): só com ele a API roda em
  # mais de uma instância. Sob profile para não pesar no dev padrão:
  # `docker compose --profile redis up -d redis` e REDIS_URL=redis://redis:6379.
  redis:
    image: redis:7-alpine
    container_name: streamz-redis
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  # Plugins do Lavalink (o source de YouTube). Sem o volume, cada `up` baixa
  # o jar do Maven de novo.
  lavalink-plugins:
  # A configuração de boas-vindas de cada servidor (um JSON por servidor).
  boas-vindas-dados:
  # Avisos e configuração por servidor do Streamz Moderação (um JSON por
  # servidor, escrita atômica). Ver `apps/bots/src/moderacao/estado.ts`.
  bot-moderacao-dados:
  # O XP de cada servidor (`<guildId>.json`), do Streamz Níveis. Ver o comentário
  # do serviço `bot-niveis` para o porquê de ele ser montado em `/home/node`.
  niveis-dados:
  # Os painéis do Streamz Cargos, um JSON por servidor. Pequeno e só dele.
  cargos-dados:
