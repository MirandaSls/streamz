services:
  postgres:
    image: postgres:16-alpine
    container_name: newdisc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: newdisc
      POSTGRES_PASSWORD: newdisc
      POSTGRES_DB: newdisc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newdisc"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LiveKit self-hosted (alternativa ao LiveKit Cloud). Fica sob o profile
  # "livekit" para NÃO subir junto do Postgres no `pnpm db:up`; use
  # `pnpm livekit:up`. Config e chaves em ./livekit.yaml (batem com o .env).
  livekit:
    image: livekit/livekit-server:latest
    container_name: newdisc-livekit
    profiles: ["livekit"]
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880" # signaling (ws)
      - "7881:7881" # rtc/tcp fallback
      - "50000-50060:50000-50060/udp" # rtc/udp (mídia)

volumes:
  pgdata:
